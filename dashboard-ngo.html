<!-- dashboard-ngo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NGO Insights</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>NGO Insights</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="ngo.html">NGO</a>
      </nav>
    </div>
  </header>

 <main class="container">

  <!-- 🔥 STATS -->
  <section class="grid">
    <div class="stat-card">
      <h3>Accepted</h3>
      <p id="acceptedCount">0</p>
    </div>

    <div class="stat-card">
      <h3>Rejected</h3>
      <p id="rejectedCount">0</p>
    </div>

    <div class="stat-card">
      <h3>Pending</h3>
      <p id="pendingCount">0</p>
    </div>
  </section>

  <!-- 🔥 CHART -->
  <section class="card">
    <h2>Requests Overview</h2>
    <canvas id="ngoChart"></canvas>
  </section>

  <!-- 🔥 DONATIONS -->
  <section class="card">
    <h2>Donations Received</h2>
    <div id="donation-list"></div>
  </section>

  </main>
  <script type="module">
    import { db, collection, getDocs, authReady, doc, updateDoc, serverTimestamp } from "./js/core/firebase.js";

    // Load chart
    async function loadChart() {
      try {
        await authReady;
        const snap = await getDocs(collection(db, "requests"));
        const requests = [];
        snap.forEach(d => requests.push(d.data()));

        // Count by status
        const accepted = requests.filter(r => r.status === "accepted").length;
        const rejected = requests.filter(r => r.status === "rejected").length;
        const pending = requests.filter(r => r.status === "pending").length;
        const ctx = document.getElementById("ngoChart").getContext("2d");
        new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["Accepted", "Rejected", "Pending"],
            datasets: [{
              data: [accepted, rejected, pending],
              backgroundColor: ["rgba(45, 106, 79, 0.8)", "rgba(244, 63, 94, 0.8)", "rgba(255, 195, 0, 0.8)"],
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: true } }
          }
        });
          document.getElementById("acceptedCount").innerText = accepted;
          document.getElementById("rejectedCount").innerText = rejected;
          document.getElementById("pendingCount").innerText = pending;
      } catch (err) {
        console.error("Chart load failed", err);
      }
    }

    // Load donations and attach listeners
    async function loadDonations() {
      const listDiv = document.getElementById("donation-list");
      listDiv.innerHTML = "<p>Loading...</p>";

      try {
        await authReady;
        const snap = await getDocs(collection(db, "donations"));

        if (snap.empty) {
          listDiv.innerHTML = "<p>No donations yet.</p>";
          return;
        }

        listDiv.innerHTML = "";

        snap.forEach(docu => {
          const d = docu.data();

          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <h3>${d.food_type || "Food"}</h3>
            <p><b>Quantity:</b> ${d.quantity || "-"}</p>
            <p><b>Location:</b> ${d.location || "-"}</p>
            <p><b>Status:</b> ${d.status || "-"}</p>
            <div style="margin-top:8px;">
              <button class="btn accept-btn" data-id="${docu.id}" style="margin-right: 8px;">Accept</button>
              <button class="btn outline reject-btn" data-id="${docu.id}">Reject</button>
            </div>
          `;

          listDiv.appendChild(card);
        });

        // Attach event listeners
        document.querySelectorAll(".accept-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            btn.innerText = "Accepting...";
            try {
              const id = btn.dataset.id;
              const ref = doc(db, "donations", id);
              await updateDoc(ref, { status: "accepted", acceptedAt: serverTimestamp() });
              alert("Donation accepted!");
              loadDonations();
            } catch (err) {
              console.error(err);
              alert("Failed to accept");
              btn.disabled = false;
              btn.innerText = "Accept";
            }
          });
        });

        document.querySelectorAll(".reject-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            btn.innerText = "Rejecting...";
            try {
              const id = btn.dataset.id;
              const ref = doc(db, "donations", id);
              await updateDoc(ref, { status: "rejected", rejectedAt: serverTimestamp() });
              alert("Donation rejected.");
              loadDonations();
            } catch (err) {
              console.error(err);
              alert("Failed to reject");
              btn.disabled = false;
              btn.innerText = "Reject";
            }
          });
        });
      } catch (err) {
        console.error("Donations load failed", err);
        listDiv.innerHTML = "<p class='note danger'>Failed to load donations</p>";
      }
    }

    loadChart();
    loadDonations();
  </script>

</body>
</html>
