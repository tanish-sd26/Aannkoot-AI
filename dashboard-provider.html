<!-- dashboard-provider.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Provider Insights</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Provider Insights</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="provider.html">Provider</a>
      </nav>
    </div>
  </header>

 <main class="container">

  <!-- 🔥 STATS -->
  <section class="grid">
    <div class="stat-card">
      <h3>Total Posts</h3>
      <p id="totalPosts">0</p>
    </div>

    <div class="stat-card">
      <h3>Total Quantity</h3>
      <p id="totalQty">0 kg</p>
    </div>

    <div class="stat-card">
      <h3>Avg Freshness</h3>
      <p id="avgFresh">0</p>
    </div>
  </section>

  <!-- 🔥 CHART -->
  <section class="card">
    <h2>Recent Surplus (Last 10)</h2>
    <canvas id="recentChart"></canvas>
  </section>

</main>

  <script type="module" src="js/core/firebase.js"></script>
  <script type="module">
    import { db, collection, getDocs, authReady } from "./js/core/firebase.js";

    async function loadChart() {
      try {
        await authReady;
        const snap = await getDocs(collection(db, "providerPosts"));
        const posts = [];
        snap.forEach(d => posts.push(d.data()));

        const last10 = posts.slice(-10);
        const labels = last10.map((p, i) => `Post ${i + 1}`);
        const quantities = last10.map(p => p.quantity || 0);
        const freshness = last10.map(p => p.freshnessScore || 0);

        const ctx = document.getElementById("recentChart").getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Quantity (kg)",
                data: quantities,
                backgroundColor: "rgba(45, 106, 79, 0.7)",
              },
              {
                label: "Freshness Score",
                data: freshness,
                backgroundColor: "rgba(255, 195, 0, 0.7)",
              }
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: true },
            },
            scales: {
              y: { beginAtZero: true, max: 100 },
            },
          },
        });
      
      
      // 🔥 Stats calculation
        document.getElementById("totalPosts").innerText = posts.length;

        const totalQty = posts.reduce((s, p) => s + (p.quantity || 0), 0);
        document.getElementById("totalQty").innerText = totalQty + " kg";

        const avgFresh = posts.length
        ? Math.round(posts.reduce((s, p) => s + (p.freshnessScore || 0), 0) / posts.length)
        : 0;

        document.getElementById("avgFresh").innerText = avgFresh; 

      }catch (err) {
        console.error("Chart load failed", err);
        document.getElementById("recentChart").parentElement.innerHTML = "<div class='note danger'>Failed to load chart data</div>";
      }
    }

    loadChart();
  </script>
</body>
</html>
