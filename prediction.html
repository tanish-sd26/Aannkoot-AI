<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Surplus Prediction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
     <div class="container">
      <h1>Prediction</h1>
      <nav>
      <a href="index.html">Home</a>
      <a href="prediction.html">Prediction</a>
      <a href="ngo.html">NGO</a>
      <a href="dashboard-provider.html">Insights</a>
      </nav>
     </div>
    </header>

    <main class="container">

  <section class="card">
    <h2>🍽 Food Surplus Prediction</h2>

    <form id="predictionForm">

      <label>Number of Students</label>
      <input type="number" id="studentCount" required>

      <label>Meal Type</label>
      <select id="mealType">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
      </select>

      <label>Day</label>
      <select id="day">
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>
      </select>

      <label>Dish</label>
      <select id="dish">
        <option>Rice</option>
        <option>Dal</option>
        <option>Sabzi</option>
        <option>Chapati</option>
        <option>Sweet</option>
      </select>

      <div style="margin-top:14px;">
        <button type="submit" class="btn">🔮 Predict</button>
      </div>

    </form>
  </section>

  <section id="predictionResult"></section>

</main>

    <script type="module" src="js/modules/prediction.js"></script>
    
</body>
</html>
